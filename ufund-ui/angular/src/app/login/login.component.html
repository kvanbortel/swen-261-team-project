<html>
<div class="main">
    <label class="login-title" for="login-box">Please enter a valid account name below:</label>
    <br />
    <input id="login" class="login-input" (keydown)="submitEnter($event, loginBox.value)" type="text" #loginBox id="login-box" />
    <br />
    <button class="login-button" type="button" (click)="login(loginBox.value)">
        Login
    </button>
    <ul class="error-area">
        <div class="popup" *ngFor='let message of messageLoginService.messages'> {{message.message}} </div>
    </ul>

</div>

</html>
