    <div class = "main">
        <label class = "login-title" for="login-box">Please enter a valid account name below:</label>

        <input id = "login" class = "login-input" type = "text" #loginBox id="login-box"/>

        <button class = "login-button" type="button" (click)="login(loginBox.value)" routerLink = "/home">Login</button>
    </div>
</html>
