<div *ngIf = "this.god" (click) = "routeProfile();" class="god-box" [ngStyle]="getDynamicStyles()">
    <div class = "god">
        <span >U-FUND GOD</span>
    </div>
    <br>
    <div class="row">
      <img class="pic" src="{{this.god.imageLink}}">
      <span class="god-title">
      {{ this.getAlias() }}
      </span>
    </div>

</div>
