<div *ngIf="!this.authService.isAdmin()" class="container">
<img class="pic" src="{{this.authService.getImage()}}">

<div class="file-upload-container">
    <input type="file" id="fileInput" class="file-input" (change)="onFileSelected($event)" accept="image/*"/>
    <label for="fileInput" class="file-upload-button">
        <i class="fa-solid fa-file-arrow-up"></i> Upload Picture
    </label>
    <div class="error" *ngIf="errored">File too large!</div>
  </div>
</div>
