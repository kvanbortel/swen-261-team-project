<div *ngIf="need" class="cupboard-need" (click)="sendData()">
    <div class="row">
      <h3 class="need-title">{{ getNeed().name }}</h3>
      <div style="display: flex; gap: 10px">
       
      </div>
    </div>
    <p class="need-description">{{ getNeed().description }}</p>
  
    <div class="need-info-row">
      <div class="info-box">
        <span class="info-label">Cost:</span>
        <span class="info-value">{{ getNeed().cost | currency }}</span>
      </div>
      <div class="info-box">
        <span class="info-label">Demand:</span>
        <span class="info-value">{{ getNeed().demandRating + "%"}}</span>
      </div>
      <div class="info-box">
        <span class="info-label">Total Quantity:</span>
        <span class="info-value">{{ getNeed().quantity }}</span>
      </div>
      <div class="info-box">
        <span class="info-label">Fulfilled:</span>
        <span class="info-value">{{ getNeed().fulfillmentStatus }}</span>
      </div>
    </div>
  </div>
