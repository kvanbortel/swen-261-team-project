<div class="profile-section">
  <div class="block" >
    <p><span>Alias:</span> {{ profileInfo.alias }}</p>
  </div>
  <div class="block" >
    <p><span>Region:</span> {{ profileInfo.region }}</p>
  </div>
  <div class="block" >
      <p><span>Pronouns:</span> {{ profileInfo.pronouns }}</p>
  </div>
  <div class="block" >
      <p><span>Bio:</span> {{ profileInfo.bio }}</p>
  </div>
  <div class="block" >
      <p><span>Email:</span> {{ profileInfo.email }}</p>
  </div>
  <div class="block" >
      <p><span>Phone Number:</span> {{ profileInfo.phoneNumber }}</p>
  </div>
  <div class="block" >
      <p><span>SSN:</span> {{ profileInfo.ssn }}</p>
  </div>
</div>
