<div class="profile-section">
  <div *ngIf="profileInfo?.alias">
    <strong>Alias:</strong> {{ profileInfo.alias }}
  </div>
  <div *ngIf="profileInfo?.region && profileInfo.region !== Region.NONE">
    <strong>Region:</strong> {{ profileInfo.region }}
  </div>
  <div *ngIf="profileInfo?.pronouns">
    <strong>Pronouns:</strong> {{ profileInfo.pronouns }}
  </div>
  <div *ngIf="profileInfo?.bio">
    <strong>Bio:</strong> {{ profileInfo.bio }}
  </div>
  <div *ngIf="profileInfo?.email">
    <strong>Email:</strong> {{ profileInfo.email }}
  </div>
  <div *ngIf="profileInfo?.phoneNumber">
    <strong>Phone Number:</strong> {{ profileInfo.phoneNumber }}
  </div>
  <div *ngIf="profileInfo?.ssn">
    <strong>SSN:</strong> {{ profileInfo.ssn }}
  </div>
</div>
