<div *ngIf = "this.rank > 3" (click) = "this.setProfile();" routerLink = "/profileother" class="cupboard-need">
    <div class="row">
      <img class="pic" src="{{this.account.imageLink}}">
      <span class="need-title">
      {{ this.rank }}. 
      {{ this.getAlias() }}
      </span>
      <span class="need-description">{{ this.formatMoney() }}</span>
    </div>

</div>
