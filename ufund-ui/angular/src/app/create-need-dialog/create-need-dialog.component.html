<div>
    <mat-dialog-content class="add-need">
        <form [formGroup]="createNeedForm" (ngSubmit)="onSubmit()">
            <div fxLayout="column" fxLayoutAlign="center center">
                <div fxFlex="100%">
                    <mat-form-field appearance="outline" class="form-field">
                        <mat-label>Name</mat-label>
                        <input matInput formControlName="name" />
                    </mat-form-field>
                </div>
                <div fxFlex="100%">
                    <mat-form-field appearance="outline" class="form-field">
                        <mat-label>Description</mat-label>
                        <textarea matInput formControlName="description"></textarea>
                    </mat-form-field>
                </div>
                <div fxFlex="100%">
                    <mat-form-field appearance="outline" class="form-field">
                        <mat-label>Cost</mat-label>
                        <input matInput formControlName="cost" />
                    </mat-form-field>
                </div>
                <div fxFlex="100%">
                    <mat-form-field appearance="outline" class="form-field">
                        <mat-label>Demand Rating</mat-label>
                        <input matInput formControlName="demandRating" />
                    </mat-form-field>
                </div>
                <div fxFlex="100%">
                    <mat-form-field appearance="outline" class="form-field">
                        <mat-label>Quantity</mat-label>
                        <input matInput formControlName="quantity" />
                    </mat-form-field>
                </div>

                <button class="form-button orange-button" mat-button type="submit"
                        [disabled]="createNeedForm.invalid">Save</button>
                <button class="form-button gray-button" mat-button mat-dialog-close>Cancel</button>
            </div>
        </form>
    </mat-dialog-content>
</div>
