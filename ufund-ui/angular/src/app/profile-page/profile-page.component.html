<div class="main">
  <app-view-change-button [text]="'Home'" [icon]="' fa-solid fa-home'" [path]="'home'"></app-view-change-button>
  <div class="flex-container">
    <img class="profilePic" src="assets/Paws&Claws.png">
    <label *ngIf="!this.authService.isAdmin()" class="username">{{this.authService.getName()}}</label>
  </div>
  <app-profile-info></app-profile-info>
  <app-profile-section [accountName]="this.accountName"></app-profile-section>
</div>
