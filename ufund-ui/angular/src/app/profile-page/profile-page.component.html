<div class="main">
  <app-view-change-button [text]="'Home'" [icon]="' fa-solid fa-home'" [path]="'home'"></app-view-change-button>
  <div class="flex-container">
    <img class="profilePic" src="assets/Paws&Claws.png">
    <label *ngIf="!this.authService.isAdmin()" class="username">{{this.authService.getName()}}</label>
    <app-edit-profile [profileInfo] = "this.profileInfo" (dataFromChild)="this.setProfileInfo()"></app-edit-profile>
  </div>
  <app-profile-section *ngIf="this.accountName" [accountName]="this.accountName" [profileInfo]="this.profileInfo"></app-profile-section>
</div>
